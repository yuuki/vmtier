# Run this configuration on two independent proxy hosts. An external redundant
# L4 load balancer or fenced VIP presents ONE cold.example:8401 endpoint to VM.
# Replace addresses; restrict these unauthenticated RPC/health ports to trusted
# networks. Stock VM RPC is TCP, so an HTTP reverse proxy is not sufficient.
global
    maxconn 4096

defaults
    mode tcp
    timeout connect 3s
    timeout client 5m
    timeout server 5m

frontend cold_rpc
    bind :8401
    default_backend vmtier_gateways

backend vmtier_gateways
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    # Readiness means committed coverage is complete. Standby archivers remain
    # eligible read gateways. Close pools when a failed node is marked down so
    # vmselect can reconnect through the stable endpoint to a surviving gateway.
    server vmtier_a 10.20.0.11:8401 check port 8080 inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server vmtier_b 10.20.0.12:8401 check port 8080 inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
