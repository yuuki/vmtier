\* expect: pass
\* Garbage collection and Cold retention racing every step on one stream of two windows.
SPECIFICATION Spec
CONSTANTS
    Archivers = {a1, a2}
    Streams = {s1}
    NumWindows = 2
    MaxAttempts = 2
    FreshKeys = TRUE
    ReadBack = TRUE
    FencePublication = TRUE
    Ledger = TRUE
    CheckPending = TRUE
    Retain = TRUE
    RecordRetired = TRUE
    Collect = TRUE
    MaxTokens = 2
    TTL = 2
    MaxTime = 2
    MaxLostReplies = 1
    NoOwner = NoOwner
    Absent = Absent
    Corrupt = Corrupt
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    CoverageContiguous
    GenerationCounts
    ReferencedObjectsVerified
    MonotoneFencing
    TokensUnique
    PublishedKeysUnrecorded
    StoredObjectsAccounted
PROPERTIES
    WindowsAppendOnly
    ReferencedObjectsImmutable
