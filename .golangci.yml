# golangci-lint v2 configuration. The version is pinned in the Makefile and in
# .github/workflows/ci.yml; bump them together. Run it with `make lint`.
version: "2"
run:
  # vendor/ is regenerated by `make bootstrap` from the committed go.mod and
  # go.sum; every build and test target reads it with -mod=vendor.
  modules-download-mode: vendor
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        # Deferred after Commit, where it returns sql.ErrTxDone by design.
        # Commit and statement errors are always checked.
        - (*database/sql.Tx).Rollback
        # Deferred removal of a temporary file that the success path renames.
        - (*os.Root).Remove
    gosec:
      excludes:
        # Unhandled errors: duplicates errcheck, which applies the
        # std-error-handling exclusions (deferred and error-path Close calls).
        - G104
        # Integer conversions: every finding converts a length, counter or
        # duration that is non-negative by construction, or follows an explicit
        # bound check (boundedBytes). Decoder bounds are fuzzed in internal/pack.
        - G115
    staticcheck:
      checks:
        - all
        # The staticcheck defaults that golangci-lint also disables.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Quickfix refactoring suggestions, not defects. For example, an
        # explicit embedded selector (QF1008) documents which wrapped
        # implementation a wrapper calls.
        - -QF*
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    paths:
      # Disposable vendored modules and the pinned stock VictoriaMetrics source.
      - vendor/
      - \.deps/
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx]
      # Table names are fixed identifiers qualified by a schema quoted once with
      # pq.QuoteIdentifier; every value is a bind parameter.
      - path: internal/catalog/postgres.*\.go
        linters: [gosec]
        text: "G202|G701"
      # The catalog directory is operator configuration, joined only with fixed
      # file names.
      - path: internal/catalog/sqlite.*\.go
        linters: [gosec]
        text: G703
      # Diagnostics keep the proper names "Cold" (the archive tier) and "Range
      # GET" (the S3 request) capitalized.
      - linters: [staticcheck]
        text: ST1005
        source: '"(Cold|Range GET) '
formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - vendor/
      - \.deps/
