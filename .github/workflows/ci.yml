name: test
# The weekly run catches drift in the stock VM build, service images and
# packages, and fuzzes for longer.
on:
  push:
  pull_request:
  schedule:
    - cron: '41 4 * * 4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # .golangci.yml reads the vendor tree that bootstrap regenerates.
      - run: make bootstrap
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          skip-cache: true
      - run: go mod tidy -diff

  # Fuzzes the pack, catalog, object-key, matcher and oracle decoders. A crasher
  # is written under testdata/fuzz and uploaded so that it can be kept as a seed.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '3m' || '15s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make bootstrap
      - run: make test-fuzz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  # Model-checks the publication protocol in spec/ with TLC, including the
  # variants that must fail, so that the model cannot pass vacuously.
  tla:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - run: make test-tla JAVA="$JAVA_HOME_21_X64/bin/java"

  # Checks the Lean proofs of the timing contract in spec/lean. elan is a
  # pinned release; it installs the toolchain spec/lean/lean-toolchain pins.
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELAN_VERSION: v4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL -o "$RUNNER_TEMP/elan.tar.gz" "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: make test-lean

  mvp:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vmtier
          POSTGRES_PASSWORD: vmtier
          POSTGRES_DB: vmtier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vmtier -d vmtier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VMTIER_TEST_POSTGRES_DSN: postgres://vmtier:vmtier@127.0.0.1:5432/vmtier_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: make bootstrap build test race vet stock
      - name: Exercise workload qualification harness
        run: python scripts/qualify_workload.py --tenants 2 --series 1000 --history-hours 4 --dense-hours 2 --replicas 2 --workdir .cache/ci-workload
      - name: Exercise catalog qualification harness
        run: python scripts/catalog_capacity.py --hours 24 --tenants 2 --repeats 1 --output .cache/ci-catalog/results.json --workdir .cache/ci-catalog/work
      - run: python -m pip install -r scripts/requirements-e2e.txt
      - run: sudo apt-get update && sudo apt-get install -y haproxy postgresql-client
      - run: python scripts/e2e.py --backend local --workdir .cache/ci-local
      - run: python scripts/e2e.py --backend s3 --replicas 2 --workdir .cache/ci-s3
      - run: python scripts/e2e_serve.py --backend local --workdir .cache/ci-serve-local
      - run: python scripts/e2e_serve.py --backend s3 --replicas 2 --pack-max-blocks 4 --workdir .cache/ci-serve-s3
      - run: python scripts/e2e_recovery.py --workdir .cache/ci-recovery-local
      - run: python scripts/e2e_postgres.py --replicas 2 --pack-max-blocks 4 --workdir .cache/ci-postgres-ha
      - run: python scripts/e2e_postgres.py --replicas 2 --pack-max-blocks 4 --migrate-sqlite --workdir .cache/ci-postgres-migration
      - name: Package E2E evidence
        if: always()
        run: python scripts/package_evidence.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-evidence
          path: .cache/e2e-evidence.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  # Keeps the release path green between tags: the pinned builder, license
  # record, static linking, packaging, and byte-for-byte repeatability.
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - run: python scripts/release.py build --unit-tests --output .cache/release/first
      - run: python scripts/release.py build --output .cache/release/second
      - run: python scripts/release.py compare .cache/release/first .cache/release/second
      - run: python scripts/release.py smoke .cache/release/first
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-snapshot
          path: .cache/release/first/
          if-no-files-found: error
          retention-days: 7
