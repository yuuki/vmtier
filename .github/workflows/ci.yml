name: test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  mvp:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: make bootstrap build test race vet stock
      - name: Exercise workload qualification harness
        run: python scripts/qualify_workload.py --tenants 2 --series 1000 --history-hours 4 --dense-hours 2 --replicas 2 --workdir .cache/ci-workload
      - name: Exercise catalog qualification harness
        run: python scripts/catalog_capacity.py --hours 24 --tenants 2 --repeats 1 --output .cache/ci-catalog/results.json --workdir .cache/ci-catalog/work
      - run: python -m pip install -r scripts/requirements-e2e.txt
      - run: python scripts/e2e.py --backend local --workdir .cache/ci-local
      - run: python scripts/e2e.py --backend s3 --replicas 2 --workdir .cache/ci-s3
      - run: python scripts/e2e_serve.py --backend local --workdir .cache/ci-serve-local
      - run: python scripts/e2e_serve.py --backend s3 --replicas 2 --pack-max-blocks 4 --workdir .cache/ci-serve-s3
      - run: python scripts/e2e_recovery.py --workdir .cache/ci-recovery-local
      - name: Package E2E evidence
        if: always()
        run: python scripts/package_evidence.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-evidence
          path: .cache/e2e-evidence.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  # Keeps the release path green between tags: the pinned builder, license
  # record, static linking, packaging, and byte-for-byte repeatability.
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - run: python scripts/release.py build --unit-tests --output .cache/release/first
      - run: python scripts/release.py build --output .cache/release/second
      - run: python scripts/release.py compare .cache/release/first .cache/release/second
      - run: python scripts/release.py smoke .cache/release/first
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-snapshot
          path: .cache/release/first/
          if-no-files-found: error
          retention-days: 7
