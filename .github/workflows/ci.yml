name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mvp:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vmtier
          POSTGRES_PASSWORD: vmtier
          POSTGRES_DB: vmtier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vmtier -d vmtier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VMTIER_TEST_POSTGRES_DSN: postgres://vmtier:vmtier@127.0.0.1:5432/vmtier_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: make bootstrap build test race vet stock
      - run: python -m pip install -r scripts/requirements-e2e.txt
      - run: sudo apt-get update && sudo apt-get install -y haproxy postgresql-client
      - run: python scripts/e2e.py --backend local --workdir .cache/ci-local
      - run: python scripts/e2e.py --backend s3 --replicas 2 --workdir .cache/ci-s3
      - run: python scripts/e2e_serve.py --backend local --workdir .cache/ci-serve-local
      - run: python scripts/e2e_serve.py --backend s3 --replicas 2 --workdir .cache/ci-serve-s3
      - run: python scripts/e2e_postgres.py --replicas 2 --workdir .cache/ci-postgres-ha
      - name: Package E2E evidence
        if: always()
        run: python scripts/package_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: .cache/e2e-evidence.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
